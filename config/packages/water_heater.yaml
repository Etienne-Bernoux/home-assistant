template:
  - binary_sensor:
      - name: Chauffe-eau en chauffe
        unique_id: water_heater_heating
        device_class: heat
        icon: mdi:water-boiler
        availability: "{{ states('sensor.chauffe_eau_puissance') | is_number }}"
        state: "{{ states('sensor.chauffe_eau_puissance') | float > 100 }}"

  - triggers:
      - trigger: state
        entity_id: switch.chauffe_eau_relais
        to: "on"
        id: closed
      - trigger: time
        at: "07:30:00"
        id: night
      - trigger: time
        at: "15:45:00"
        id: midday
    binary_sensor:
      - name: Chauffe-eau pas chauffé
        unique_id: water_heater_missed_heating
        device_class: problem
        icon: mdi:water-boiler-alert
        state: >
          {% if trigger.id == 'closed' %}
            false
          {% else %}
            {% set closed = this.attributes.get('last_closed') %}
            {% set start = today_at('00:00') if trigger.id == 'night' else today_at('07:00') %}
            {{ not is_state('switch.chauffe_eau_relais', 'on')
               and (closed is none or as_datetime(closed) < start) }}
          {% endif %}
        attributes:
          last_closed: >
            {{ now().isoformat() if trigger.id == 'closed' else this.attributes.get('last_closed') }}
          window: >
            {{ trigger.id if trigger.id in ['night', 'midday'] else this.attributes.get('window') }}

  - triggers:
      - trigger: state
        entity_id: switch.chauffe_eau_relais
        from: "on"
        to: "off"
    binary_sensor:
      - name: Chauffe-eau pas plein
        unique_id: water_heater_not_full
        icon: mdi:water-boiler-off
        state: "{{ is_state('binary_sensor.chauffe_eau_en_chauffe', 'on') }}"

  - triggers:
      - trigger: state
        entity_id: binary_sensor.chauffe_eau_en_chauffe
        from: "on"
        to: "off"
        for: "00:03:00"
    conditions:
      - condition: state
        entity_id: switch.chauffe_eau_relais
        state: "on"
      - condition: template
        value_template: "{{ trigger.to_state.last_changed - trigger.from_state.last_changed > timedelta(minutes=10) }}"
    sensor:
      - name: Chauffe-eau dernière fois à température
        unique_id: water_heater_last_full
        device_class: timestamp
        icon: mdi:water-boiler
        state: "{{ trigger.to_state.last_changed.isoformat() }}"

automation:
  - id: water_heater_preheat
    alias: Avancer d'une heure la chauffe si le ballon n'a pas fini la précédente
    mode: single
    triggers:
      - trigger: time
        at: "01:00:00"
      - trigger: time
        at: "11:30:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.chauffe_eau_pas_plein
        state: "on"
      - condition: state
        entity_id: switch.chauffe_eau_relais
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.chauffe_eau_relais
