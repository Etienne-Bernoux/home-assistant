automation:
  - id: alert_data_source_offline
    alias: Alerter si l'Envoy ou MyLight ne répond plus
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.envoy_122333060519_production_d_electricite_actuelle
        to: unavailable
        for: "00:30:00"
        id: envoy_down
      - trigger: state
        entity_id: sensor.envoy_122333060519_production_d_electricite_actuelle
        from: unavailable
        id: envoy_up
      - trigger: state
        entity_id: sensor.mylight_systems_decharge_batterie
        to: unavailable
        for: "01:00:00"
        id: mylight_down
      - trigger: state
        entity_id: sensor.mylight_systems_decharge_batterie
        from: unavailable
        id: mylight_up
    conditions:
      - condition: template
        value_template: >
          {{ trigger.id.endswith('_down')
             or (trigger.to_state.state not in ['unavailable', 'unknown']
                 and now() - trigger.from_state.last_changed > timedelta(minutes=30)) }}
    actions:
      - variables:
          source: "{{ 'Envoy' if trigger.id.startswith('envoy') else 'MyLight' }}"
      - action: notify.mobile_app_pixel_6
        data:
          title: "{{ source }} {{ 'ne répond plus' if trigger.id.endswith('_down') else 'répond de nouveau' }}"
          message: >
            {% if trigger.id.endswith('_down') %}
              Aucune donnée depuis {{ '30 minutes' if source == 'Envoy' else '1 heure' }}.
            {% else %}
              Coupure de {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(0) | int }} minutes.
            {% endif %}

  - id: alexa_temperatures_reload
    alias: Recharger l'intégration Alexa quand les températures des Echo tombent
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{ ['sensor.echo_bureau_temperature', 'sensor.echo_dot_salon_temperature', 'sensor.echo_dot_cuisine_temperature']
             | map('states') | reject('in', ['unavailable', 'unknown']) | list | count == 0 }}
        for: "00:15:00"
    actions:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: sensor.echo_bureau_temperature
      - wait_template: "{{ states('sensor.echo_bureau_temperature') | is_number }}"
        timeout: "00:02:00"
      - action: notify.mobile_app_pixel_6
        data:
          title: Températures des Echo
          message: >
            {% if wait.completed %}
              Les trois Echo ne donnaient plus leur température depuis 15 minutes : l'intégration Alexa a été rechargée, elles sont revenues.
            {% else %}
              Les trois Echo ne donnent plus leur température depuis 15 minutes, et recharger l'intégration Alexa n'a pas suffi.
            {% endif %}

  - id: alert_backup_failed
    alias: Alerter si une sauvegarde échoue ou manque
    mode: single
    triggers:
      - trigger: state
        entity_id: event.backup_automatic_backup
        id: event
      - trigger: time
        at: "09:00:00"
        id: daily_check
    conditions:
      - condition: template
        value_template: >
          {% if trigger.id == 'event' %}
            {{ trigger.to_state.attributes.event_type == 'failed' }}
          {% else %}
            {% set last = states('sensor.backup_last_successful_automatic_backup') | as_datetime %}
            {{ last is none or now() - last > timedelta(hours=26) }}
          {% endif %}
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Sauvegarde Home Assistant
          message: >
            {% if trigger.id == 'event' %}
              La sauvegarde automatique a échoué.
            {% else %}
              Aucune sauvegarde réussie depuis plus de 26 heures.
            {% endif %}

  - id: notify_home_assistant_started
    alias: Prévenir quand Home Assistant redémarre
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Home Assistant a redémarré
          message: "Démarrage à {{ now().strftime('%H:%M') }}."

  - id: annex_line_overload
    alias: Alerter si l'annexe tire près de la limite de sa ligne
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.annexe_courant
        above: input_number.annexe_seuil_courant
        for: "00:15:00"
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Annexe proche de la limite
          message: >
            L'annexe tire {{ states('sensor.annexe_courant') | float | round(1) }} A
            depuis 15 minutes, au-dessus du seuil de {{ states('input_number.annexe_seuil_courant') | float }} A,
            sur une ligne de 20 A. Évitez d'y lancer en plus le four ou une machine.

  - id: cellar_plug_off
    alias: Alerter si la prise du congélateur est coupée
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.prise_cellier
        to: "off"
        for: "00:01:00"
        id: switched_off
      - trigger: state
        entity_id: switch.prise_cellier
        to: unavailable
        for: "00:10:00"
        id: unreachable
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Congélateur du cellier
          message: >
            {% if trigger.id == 'switched_off' %}
              La prise du congélateur et du petit frigo est coupée. Rallumez-la depuis Home Assistant.
            {% else %}
              La prise du congélateur et du petit frigo ne répond plus depuis 10 minutes : coupure de courant ou disjoncteur.
            {% endif %}

  - id: kitchen_fridge_plug_off
    alias: Alerter si la prise du frigo de la cuisine est coupée
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.prise_frigo
        to: "off"
        for: "00:01:00"
        id: switched_off
      - trigger: state
        entity_id: switch.prise_frigo
        to: unavailable
        for: "00:10:00"
        id: unreachable
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Frigo de la cuisine
          message: >
            {% if trigger.id == 'switched_off' %}
              La prise du frigo de la cuisine est coupée. Rallumez-la depuis Home Assistant.
            {% else %}
              La prise du frigo de la cuisine ne répond plus depuis 10 minutes : coupure de courant ou disjoncteur.
            {% endif %}

  - id: pump_plug_off
    alias: Rallumer la prise de la pompe après une coupure de protection
    mode: queued
    triggers:
      - trigger: state
        entity_id: switch.prise_pompe
        from: "on"
        to: "off"
        id: switched_off
      - trigger: state
        entity_id: switch.prise_pompe
        to: "off"
        for: "00:01:00"
        id: still_off
      - trigger: state
        entity_id: switch.prise_pompe
        to: unavailable
        for: "00:10:00"
        id: unreachable
    variables:
      protection: >
        {{ is_state('binary_sensor.prise_pompe_surintensite', 'on')
           or is_state('binary_sensor.prise_pompe_surcharge', 'on')
           or is_state('binary_sensor.prise_pompe_surchauffe', 'on') }}
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'switched_off' and protection }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.prise_pompe
      - action: notify.mobile_app_pixel_6
        data:
          title: Pompe
          message: >
            {% if trigger.id == 'unreachable' %}
              Le Shelly de la pompe ne répond plus depuis 10 minutes : coupure de courant ou disjoncteur. Sans lui, la maison n'a plus d'eau.
            {% elif trigger.id == 'still_off' %}
              Le Shelly de la pompe reste éteint depuis 1 minute : la maison n'a plus d'eau. Rallumez-le depuis Home Assistant.
            {% elif protection %}
              Le Shelly de la pompe a coupé sur une protection (surintensité, surcharge ou surchauffe), sans doute au démarrage du moteur. Il se rallume de lui-même après 5 secondes, et Home Assistant l'a rallumé.
            {% else %}
              Le Shelly de la pompe a été éteint : il se rallume de lui-même après 5 secondes. Pour intervenir sur la pompe, débranchez-la.
            {% endif %}

  - id: water_heater_missed_heating
    alias: Alerter si le chauffe-eau n'a pas chauffé pendant les heures creuses
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.chauffe_eau_pas_chauffe
        not_from: unavailable
        to: "on"
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Chauffe-eau
          message: >
            {% if state_attr('binary_sensor.chauffe_eau_pas_chauffe', 'window') == 'night' %}
              Le relais MyLight ne s'est pas fermé cette nuit entre 2 h et 7 h : l'eau n'a pas chauffé.
            {% else %}
              Le relais MyLight ne s'est pas fermé depuis 7 h, heures creuses de midi comprises : l'eau n'a pas chauffé.
            {% endif %}
            Vérifiez le mode du relais dans l'application MyLight.

  - id: water_heater_not_full_for_a_week
    alias: Alerter si le chauffe-eau n'a pas atteint sa consigne depuis 7 jours
    mode: single
    triggers:
      - trigger: time
        at: "08:00:00"
    variables:
      last: "{{ states('sensor.chauffe_eau_derniere_fois_a_temperature') }}"
    conditions:
      - condition: template
        value_template: >
          {% set t = last | as_datetime(none) %}
          {{ t is not none and now() - t > timedelta(days=7) }}
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Chauffe-eau
          message: >
            Le ballon n'a pas atteint sa consigne de 60 °C depuis le {{ as_local(last | as_datetime).strftime('%d/%m') }} :
            le thermostat ne coupe plus avant la fin des heures creuses. Contrôlez la résistance,
            et faites une chauffe complète contre les légionelles.

  - id: solar_inverter_underperforming
    alias: Alerter si un micro-onduleur a produit moins de la moitié des autres
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "-00:30:00"
    variables:
      daily: >
        {% set ns = namespace(items=[]) %}
        {% for s in states.sensor | selectattr('entity_id', 'match', 'sensor\.inverter_\d+_production_d_energie_du_jour$') %}
          {% set ns.items = ns.items + [{'serial': s.entity_id.split('_')[1][-4:], 'wh': s.state | float(-1)}] %}
        {% endfor %}
        {{ ns.items }}
      median: >
        {% set values = daily | map(attribute='wh') | select('ge', 0) | sort | list %}
        {{ values[values | count // 2] if values else 0 }}
      weak: "{{ daily | selectattr('wh', 'lt', median * 0.5) | map(attribute='serial') | list }}"
    conditions:
      - condition: template
        value_template: "{{ median > 50 and weak | count > 0 }}"
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Panneaux solaires
          message: >
            {{ weak | count }} micro-onduleur{{ 's' if weak | count > 1 else '' }}
            ({{ weak | join(', ') }})
            {{ 'ont' if weak | count > 1 else 'a' }} produit moins de la moitié des {{ median | round(0) | int }} Wh
            des autres aujourd'hui : panne, ombre nouvelle ou panneau sale. Voir la page Solaire.

  - id: yoto_charge_reminder
    alias: Rappeler de recharger les Yoto avant la nuit
    mode: single
    triggers:
      - trigger: time
        at: "18:30:00"
    variables:
      low: >
        {% set ns = namespace(names=[]) %}
        {% for name, slug in [('Aimée', 'aimee'), ('Ambroise', 'ambroise')] %}
          {% set level = states('sensor.yoto_' ~ slug ~ '_batterie') | float(100) %}
          {% if level < 20 and is_state('binary_sensor.yoto_' ~ slug ~ '_en_charge', 'off') %}
            {% set ns.names = ns.names + ["le Yoto d'" ~ name ~ ", à " ~ level | int ~ " pour cent"] %}
          {% endif %}
        {% endfor %}
        {{ ns.names }}
    conditions:
      - condition: template
        value_template: "{{ low | count > 0 }}"
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.partout_annoncer
        data:
          message: "Pensez à mettre en charge {{ low | join(', et ') }}."

  - id: doorbell_announce
    alias: Prévenir le téléphone quand on sonne
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: event.porte_d_entree_sonnerie
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state.attributes.event_type == 'ring'
             and trigger.to_state.state | as_datetime is not none
             and now() - (trigger.to_state.state | as_datetime) < timedelta(seconds=30) }}
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Sonnette
          message: Quelqu'un sonne à la porte d'entrée.
      - delay: "00:00:30"

  - id: doorbell_history_fallback
    alias: Prévenir le téléphone d'un coup de sonnette vu dans l'historique Ring
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.porte_d_entree_derniere_activite
    conditions:
      - condition: template
        value_template: >
          {% set ding = trigger.to_state.state | as_datetime(none) %}
          {% set never = as_datetime('1970-01-01T00:00:00+00:00') %}
          {% set pushed = state_attr('automation.prevenir_le_telephone_quand_on_sonne', 'last_triggered') or never %}
          {{ trigger.to_state.attributes.category == 'ding'
             and ding is not none
             and now() - ding < timedelta(minutes=5)
             and ding > (this.attributes.last_triggered or never)
             and pushed < ding - timedelta(seconds=60) }}
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          title: Sonnette
          message: >
            Quelqu'un a sonné à la porte d'entrée à {{ (trigger.to_state.state | as_datetime | as_local).strftime('%H:%M') }}.
