template:
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    sensor:
      - name: Rentabilité MyLight compteurs
        unique_id: mylight_profitability_engine
        icon: mdi:calculator
        state: "{{ now().isoformat() }}"
        attributes:
          day: "{{ now().date() | string }}"
          last_bought: "{{ states('sensor.mylight_systems_consommation_reseau_sans_batterie_virtuelle') | float(this.attributes.get('last_bought', 0) | float(0)) }}"
          last_returned: "{{ states('sensor.mylight_systems_decharge_batterie') | float(this.attributes.get('last_returned', 0) | float(0)) }}"
          last_green: "{{ states('sensor.mylight_systems_energie_verte_solaire_direct') | float(this.attributes.get('last_green', 0) | float(0)) }}"
          last_reinjected: "{{ states('sensor.mylight_systems_energie_reinjectee_au_reseau') | float(this.attributes.get('last_reinjected', 0) | float(0)) }}"
          ml_energy_eur: >
            {% from 'mylight.jinja' import baseline %}
            {% from 'mylight_profitability.jinja' import energy_delta_kwh, mylight_energy_cost %}
            {% set same_day = this.attributes.get('day') == now().date() | string %}
            {% set bought = energy_delta_kwh(states('sensor.mylight_systems_consommation_reseau_sans_batterie_virtuelle'), this.attributes.get('last_bought', 0), same_day) | float %}
            {% set reinjected = energy_delta_kwh(states('sensor.mylight_systems_energie_reinjectee_au_reseau'), this.attributes.get('last_reinjected', 0), same_day) | float %}
            {% set price = states('sensor.prix_electricite') | float(0.2142) %}
            {{ mylight_energy_cost(this.attributes.get('ml_energy_eur') | float((baseline() | from_json).ml_energy_eur), bought, reinjected, price) }}
          edf_panels_eur: >
            {% from 'mylight.jinja' import baseline %}
            {% from 'mylight_profitability.jinja' import energy_delta_kwh, edf_with_panels_cost %}
            {% set same_day = this.attributes.get('day') == now().date() | string %}
            {% set bought = energy_delta_kwh(states('sensor.mylight_systems_consommation_reseau_sans_batterie_virtuelle'), this.attributes.get('last_bought', 0), same_day) | float %}
            {% set returned = energy_delta_kwh(states('sensor.mylight_systems_decharge_batterie'), this.attributes.get('last_returned', 0), same_day) | float %}
            {{ edf_with_panels_cost(this.attributes.get('edf_panels_eur') | float((baseline() | from_json).edf_panels_eur), bought, returned, is_state('binary_sensor.heures_creuses', 'on')) }}
          no_panels_eur: >
            {% from 'mylight.jinja' import baseline %}
            {% from 'mylight_profitability.jinja' import energy_delta_kwh, edf_without_panels_cost %}
            {% set same_day = this.attributes.get('day') == now().date() | string %}
            {% set bought = energy_delta_kwh(states('sensor.mylight_systems_consommation_reseau_sans_batterie_virtuelle'), this.attributes.get('last_bought', 0), same_day) | float %}
            {% set returned = energy_delta_kwh(states('sensor.mylight_systems_decharge_batterie'), this.attributes.get('last_returned', 0), same_day) | float %}
            {% set green = energy_delta_kwh(states('sensor.mylight_systems_energie_verte_solaire_direct'), this.attributes.get('last_green', 0), same_day) | float %}
            {{ edf_without_panels_cost(this.attributes.get('no_panels_eur') | float((baseline() | from_json).no_panels_eur), bought, returned, green, is_state('binary_sensor.heures_creuses', 'on')) }}
          fixed_eur: >
            {% from 'mylight.jinja' import msb_forfaits, baseline %}
            {% set forfaits = msb_forfaits() | from_json %}
            {% set ns = namespace(total=0) %}
            {% for forfait in forfaits %}
              {% set begin = as_datetime(forfait.from ~ 'T00:00:00').replace(tzinfo=now().tzinfo) %}
              {% set end = as_datetime(forfaits[loop.index].from ~ 'T00:00:00').replace(tzinfo=now().tzinfo) if not loop.last else now() %}
              {% set end = [end, now()] | min %}
              {% if end > begin %}
                {% set ns.total = ns.total + forfait.monthly * 12 / 365.25 * (end - begin).total_seconds() / 86400 %}
              {% endif %}
            {% endfor %}
            {% set contribution_start = as_datetime((baseline() | from_json).contribution_start ~ 'T00:00:00').replace(tzinfo=now().tzinfo) %}
            {% set contribution = 58 / 365.25 * (now() - contribution_start).total_seconds() / 86400 %}
            {{ (ns.total + contribution) | round(4) }}

  - sensor:
      - name: Gain MyLight cumulé
        unique_id: mylight_gain_total
        icon: mdi:battery-heart-variant
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        availability: "{% set e = 'sensor.rentabilite_mylight_compteurs' %}{{ state_attr(e, 'ml_energy_eur') is number and state_attr(e, 'edf_panels_eur') is number and state_attr(e, 'no_panels_eur') is number and state_attr(e, 'fixed_eur') is number }}"
        state: >
          {% set a = states.sensor.rentabilite_mylight_compteurs.attributes %}
          {{ (a.edf_panels_eur | float - a.ml_energy_eur | float - a.fixed_eur | float) | round(2) }}
      - name: Économie installation cumulée
        unique_id: solar_savings_total
        icon: mdi:solar-power-variant
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        availability: "{% set e = 'sensor.rentabilite_mylight_compteurs' %}{{ state_attr(e, 'ml_energy_eur') is number and state_attr(e, 'edf_panels_eur') is number and state_attr(e, 'no_panels_eur') is number and state_attr(e, 'fixed_eur') is number }}"
        state: >
          {% set a = states.sensor.rentabilite_mylight_compteurs.attributes %}
          {{ (a.no_panels_eur | float - a.ml_energy_eur | float - a.fixed_eur | float) | round(2) }}
      - name: Amortissement installation
        unique_id: solar_payback_progress
        icon: mdi:progress-check
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ states('sensor.economie_installation_cumulee') | is_number }}"
        state: >
          {% from 'mylight.jinja' import investments %}
          {{ (states('sensor.economie_installation_cumulee') | float / (investments() | from_json).installation_total * 100) | round(1) }}
      - name: Économie annuelle attendue
        unique_id: solar_savings_expected_yearly
        icon: mdi:chart-line
        unit_of_measurement: EUR
        state: >
          {% from 'mylight.jinja' import ml_tariffs, msb_forfaits, reference_year %}
          {% set today = now().date() | string %}
          {% set tariff = ml_tariffs() | from_json | selectattr('from', '<=', today) | list | last %}
          {% set forfait = msb_forfaits() | from_json | selectattr('from', '<=', today) | list | last %}
          {% set year = reference_year() | from_json %}
          {% set ml_avg = 0.75 * tariff.peak + 0.25 * tariff.off_peak %}
          {% set trv_avg = 0.75 * 0.2142 + 0.25 * 0.1589 %}
          {{ ((year.green_kwh + year.bought_kwh + year.returned_kwh) * trv_avg - year.bought_kwh * ml_avg
              - forfait.monthly * 12 - 58 + year.reinjected_kwh * 0.042) | round(0) }}
      - name: Retour sur investissement estimé
        unique_id: solar_payback_date
        icon: mdi:calendar-check
        device_class: date
        availability: >
          {{ states('sensor.economie_installation_cumulee') | is_number
             and states('sensor.economie_annuelle_attendue') | float(0) > 0 }}
        state: >
          {% from 'mylight.jinja' import investments %}
          {% set remaining = (investments() | from_json).installation_total - states('sensor.economie_installation_cumulee') | float %}
          {% if remaining <= 0 %}
            {{ now().date() }}
          {% else %}
            {{ (now() + timedelta(days=remaining / (states('sensor.economie_annuelle_attendue') | float) * 365.25)).date() }}
          {% endif %}
      - name: Gain MyLight annuel attendu
        unique_id: mylight_gain_expected_yearly
        icon: mdi:chart-line
        unit_of_measurement: EUR
        state: >
          {% from 'mylight.jinja' import ml_tariffs, msb_forfaits, reference_year %}
          {% set today = now().date() | string %}
          {% set tariff = ml_tariffs() | from_json | selectattr('from', '<=', today) | list | last %}
          {% set forfait = msb_forfaits() | from_json | selectattr('from', '<=', today) | list | last %}
          {% set year = reference_year() | from_json %}
          {% set ml_avg = 0.75 * tariff.peak + 0.25 * tariff.off_peak %}
          {% set trv_avg = 0.75 * 0.2142 + 0.25 * 0.1589 %}
          {{ ((year.bought_kwh + year.returned_kwh) * trv_avg - year.bought_kwh * ml_avg
              - forfait.monthly * 12 - 58 + year.reinjected_kwh * 0.042) | round(0) }}
      - name: Remboursement MyLight estimé
        unique_id: mylight_payback_date
        icon: mdi:calendar-check
        device_class: date
        availability: >
          {{ states('sensor.gain_mylight_cumule') | is_number
             and states('sensor.gain_mylight_annuel_attendu') | float(0) > 0 }}
        state: >
          {% from 'mylight.jinja' import investments %}
          {% set remaining = (investments() | from_json).mylight_hardware - states('sensor.gain_mylight_cumule') | float %}
          {% if remaining <= 0 %}
            {{ now().date() }}
          {% else %}
            {{ (now() + timedelta(days=remaining / (states('sensor.gain_mylight_annuel_attendu') | float) * 365.25)).date() }}
          {% endif %}
      - name: État de charge batterie virtuelle
        unique_id: mylight_virtual_battery_soc
        unit_of_measurement: "%"
        icon: mdi:battery-heart-variant
        state_class: measurement
        availability: "{{ states('sensor.mylight_systems_energie_stockee_en_batterie') | is_number }}"
        state: >
          {% from 'mylight.jinja' import msb_forfaits %}
          {% set forfait = msb_forfaits() | from_json | selectattr('from', '<=', now().date() | string) | list | last %}
          {{ ([states('sensor.mylight_systems_energie_stockee_en_batterie') | float / forfait.kwh * 100, 100] | min) | round(1) }}
      - name: Puissance batterie virtuelle
        unique_id: mylight_virtual_battery_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.envoy_122333060519_consommation_nette_de_puissance_actuelle') | is_number
             and states('sensor.mylight_systems_energie_stockee_en_batterie') | is_number }}
        state: >
          {% from 'mylight.jinja' import msb_forfaits %}
          {% set forfait = msb_forfaits() | from_json | selectattr('from', '<=', now().date() | string) | list | last %}
          {% set net = states('sensor.envoy_122333060519_consommation_nette_de_puissance_actuelle') | float %}
          {% set stock = states('sensor.mylight_systems_energie_stockee_en_batterie') | float %}
          {{ (net if (net > 0 and stock > 0) or (net < 0 and stock < forfait.kwh) else 0) | round(3) }}
      - name: Puissance réseau facturée
        unique_id: mylight_billed_grid_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.envoy_122333060519_consommation_nette_de_puissance_actuelle') | is_number
             and states('sensor.puissance_batterie_virtuelle') | is_number }}
        state: >
          {{ (states('sensor.envoy_122333060519_consommation_nette_de_puissance_actuelle') | float
              - states('sensor.puissance_batterie_virtuelle') | float) | round(3) }}

  - triggers:
      - trigger: state
        entity_id: sensor.annexe_energie
    sensor:
      - name: Majoration annexe mesurée
        unique_id: annex_billing_premium_measured
        icon: mdi:cash-plus
        unit_of_measurement: EUR
        state: >
          {% from 'mylight.jinja' import ml_tariffs, annex_billing %}
          {% set billing = annex_billing() | from_json %}
          {% set peak = (ml_tariffs() | from_json | selectattr('from', '<=', now().date() | string) | list | last).peak %}
          {% set energy = states('sensor.annexe_energie') %}
          {% set total = this.state | float(0) if this.attributes.get('since') == billing.readings[-1].date else 0 %}
          {% if energy | is_number %}
            {% set delta = energy | float - this.attributes.get('last_kwh', 0) | float(0) %}
            {% if delta > 0 %}
              {% set total = total + delta * (peak - billing.trv_peak) %}
            {% endif %}
          {% endif %}
          {{ total | round(4) }}
        attributes:
          since: >
            {% from 'mylight.jinja' import annex_billing %}
            {{ (annex_billing() | from_json).readings[-1].date }}
          last_kwh: >
            {% set energy = states('sensor.annexe_energie') %}
            {{ energy | float if energy | is_number else this.attributes.get('last_kwh', 0) }}

  - sensor:
      - name: Majoration refacturée à l'annexe
        unique_id: annex_billing_premium_total
        icon: mdi:cash-plus
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        availability: "{{ states('sensor.majoration_annexe_mesuree') | is_number }}"
        state: >
          {% from 'mylight.jinja' import ml_tariffs, annex_billing, baseline %}
          {% set billing = annex_billing() | from_json %}
          {% set peak = (ml_tariffs() | from_json | selectattr('from', '<=', now().date() | string) | list | last).peak %}
          {% set start = as_datetime((baseline() | from_json).contribution_start ~ 'T00:00:00').replace(tzinfo=now().tzinfo) %}
          {% set r = billing.readings %}
          {% set ns = namespace(total=0, rate=0) %}
          {% for i in range(1, r | count) %}
            {% set a = as_datetime(r[i - 1].date ~ 'T00:00:00').replace(tzinfo=now().tzinfo) %}
            {% set b = as_datetime(r[i].date ~ 'T00:00:00').replace(tzinfo=now().tzinfo) %}
            {% set ns.rate = (r[i].index - r[i - 1].index) / ((b - a).total_seconds() / 86400) %}
            {% set begin = [a, start] | max %}
            {% if b > begin %}
              {% set ns.total = ns.total + ns.rate * (b - begin).total_seconds() / 86400 * (r[i].price - billing.trv_peak) %}
            {% endif %}
          {% endfor %}
          {% set last = as_datetime(r[-1].date ~ 'T00:00:00').replace(tzinfo=now().tzinfo) %}
          {% set gap_end = [now(), as_datetime(billing.shelly_start)] | min %}
          {% if gap_end > last %}
            {% set ns.total = ns.total + ns.rate * (gap_end - last).total_seconds() / 86400 * (peak - billing.trv_peak) %}
          {% endif %}
          {{ (ns.total + states('sensor.majoration_annexe_mesuree') | float) | round(2) }}
      - name: Gain MyLight cumulé, annexe refacturée
        unique_id: mylight_gain_total_annex_billed
        icon: mdi:battery-heart-variant
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        availability: "{{ states('sensor.gain_mylight_cumule') | is_number and states('sensor.majoration_refacturee_a_l_annexe') | is_number }}"
        state: "{{ (states('sensor.gain_mylight_cumule') | float + states('sensor.majoration_refacturee_a_l_annexe') | float) | round(2) }}"
      - name: Économie installation cumulée, annexe refacturée
        unique_id: solar_savings_total_annex_billed
        icon: mdi:solar-power-variant
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        availability: "{{ states('sensor.economie_installation_cumulee') | is_number and states('sensor.majoration_refacturee_a_l_annexe') | is_number }}"
        state: "{{ (states('sensor.economie_installation_cumulee') | float + states('sensor.majoration_refacturee_a_l_annexe') | float) | round(2) }}"
      - name: Amortissement installation, annexe refacturée
        unique_id: solar_payback_progress_annex_billed
        icon: mdi:progress-check
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ states('sensor.economie_installation_cumulee_annexe_refacturee') | is_number }}"
        state: >
          {% from 'mylight.jinja' import investments %}
          {{ (states('sensor.economie_installation_cumulee_annexe_refacturee') | float / (investments() | from_json).installation_total * 100) | round(1) }}
      - name: Majoration annuelle attendue de l'annexe
        unique_id: annex_billing_premium_expected_yearly
        icon: mdi:cash-plus
        unit_of_measurement: EUR
        state: >
          {% from 'mylight.jinja' import ml_tariffs, annex_billing %}
          {% set billing = annex_billing() | from_json %}
          {% set peak = (ml_tariffs() | from_json | selectattr('from', '<=', now().date() | string) | list | last).peak %}
          {{ (billing.reference_kwh * (peak - billing.trv_peak)) | round(0) }}
      - name: Économie annuelle attendue, annexe refacturée
        unique_id: solar_savings_expected_yearly_annex_billed
        icon: mdi:chart-line
        unit_of_measurement: EUR
        state: "{{ (states('sensor.economie_annuelle_attendue') | float(0) + states('sensor.majoration_annuelle_attendue_de_l_annexe') | float(0)) | round(0) }}"
      - name: Gain MyLight annuel attendu, annexe refacturée
        unique_id: mylight_gain_expected_yearly_annex_billed
        icon: mdi:chart-line
        unit_of_measurement: EUR
        state: "{{ (states('sensor.gain_mylight_annuel_attendu') | float(0) + states('sensor.majoration_annuelle_attendue_de_l_annexe') | float(0)) | round(0) }}"
      - name: Remboursement MyLight estimé, annexe refacturée
        unique_id: mylight_payback_date_annex_billed
        icon: mdi:calendar-check
        device_class: date
        availability: >
          {{ states('sensor.gain_mylight_cumule_annexe_refacturee') | is_number
             and states('sensor.gain_mylight_annuel_attendu_annexe_refacturee') | float(0) > 0 }}
        state: >
          {% from 'mylight.jinja' import investments %}
          {% set remaining = (investments() | from_json).mylight_hardware - states('sensor.gain_mylight_cumule_annexe_refacturee') | float %}
          {% if remaining <= 0 %}
            {{ now().date() }}
          {% else %}
            {{ (now() + timedelta(days=remaining / (states('sensor.gain_mylight_annuel_attendu_annexe_refacturee') | float) * 365.25)).date() }}
          {% endif %}
      - name: Retour sur investissement estimé, annexe refacturée
        unique_id: solar_payback_date_annex_billed
        icon: mdi:calendar-check
        device_class: date
        availability: >
          {{ states('sensor.economie_installation_cumulee_annexe_refacturee') | is_number
             and states('sensor.economie_annuelle_attendue_annexe_refacturee') | float(0) > 0 }}
        state: >
          {% from 'mylight.jinja' import investments %}
          {% set remaining = (investments() | from_json).installation_total - states('sensor.economie_installation_cumulee_annexe_refacturee') | float %}
          {% if remaining <= 0 %}
            {{ now().date() }}
          {% else %}
            {{ (now() + timedelta(days=remaining / (states('sensor.economie_annuelle_attendue_annexe_refacturee') | float) * 365.25)).date() }}
          {% endif %}
