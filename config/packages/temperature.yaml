automation:
  - id: office_heating_schedule
    alias: Réguler le chauffage du bureau
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.echo_bureau_temperature
          - binary_sensor.workday_sensor_fr
        to: null
    variables:
      local_time: "{{ now().strftime('%H:%M') }}"
      workday: "{{ states('binary_sensor.workday_sensor_fr') }}"
      relay: "{{ states('switch.prise_radiateur') }}"
      reading: "{{ states('sensor.echo_bureau_temperature') }}"
      reading_age: >-
        {{ (now() - states.sensor.echo_bureau_temperature.last_reported).total_seconds()
           if is_number(reading) else none }}
      comfort: "{{ workday == 'on' and '08:00' <= local_time < '18:00' }}"
      temperature: "{{ reading | float(none) }}"
      valid_reading: >-
        {{ temperature is not none and -40 < temperature < 60
           and 0 <= reading_age < 600 }}
      heat_below: "{{ 19 if comfort else 12.5 }}"
      stop_at: "{{ 19.5 if comfort else 13 }}"
    actions:
      - choose:
          - conditions: >-
              {{ relay == 'on' and (not valid_reading or temperature >= stop_at) }}
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.prise_radiateur
          - conditions: >-
              {{ relay == 'off' and valid_reading and temperature < heat_below }}
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.prise_radiateur

sensor:
  - platform: statistics
    name: Hausse température cuisine
    unique_id: kitchen_temperature_rise
    entity_id: sensor.echo_dot_cuisine_temperature
    state_characteristic: change
    max_age:
      hours: 1
    sampling_size: 100
    keep_last_sample: true

template:
  - sensor:
      - name: Température cuisine
        unique_id: temperature_cuisine
        icon: mdi:thermometer
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ ['sensor.echo_dot_cuisine_temperature', 'sensor.h5075_c055_temperature']
             | map('states') | select('is_number') | map('float') | select('gt', -40) | list | count > 0 }}
        state: >
          {{ ['sensor.echo_dot_cuisine_temperature', 'sensor.h5075_c055_temperature']
             | map('states') | select('is_number') | map('float') | select('gt', -40)
             | list | average | round(1) }}
      - name: Température moyenne maison
        unique_id: temperature_moyenne_maison
        icon: mdi:home-thermometer
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ ['sensor.echo_dot_salon_temperature', 'sensor.temperature_cuisine',
              'sensor.echo_bureau_temperature',
              'sensor.salle_de_jeu_temperature'] | map('states') | select('is_number') | map('float')
             | select('gt', -40) | list | count > 0 }}
        state: >
          {{ ['sensor.echo_dot_salon_temperature', 'sensor.temperature_cuisine',
              'sensor.echo_bureau_temperature',
              'sensor.salle_de_jeu_temperature'] | map('states') | select('is_number') | map('float')
             | select('gt', -40) | list | average | round(1) }}
      - name: Poêle allumé
        unique_id: poele_activite
        icon: mdi:fireplace
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ states('binary_sensor.poele') in ['on', 'off'] }}"
        state: "{{ 100 if is_state('binary_sensor.poele', 'on') else 0 }}"
  - binary_sensor:
      - name: Poêle
        unique_id: poele_allume
        device_class: heat
        state: >
          {% set c = states('sensor.echo_dot_cuisine_temperature') | float(none) %}
          {% set s = states('sensor.echo_dot_salon_temperature') | float(none) %}
          {% if c is none or s is none or not (-40 < c < 60 and -40 < s < 60) %}
            {{ this.state == 'on' }}
          {% else %}
            {% set gap = c - s %}
            {% set rise = states('sensor.hausse_temperature_cuisine') | float(0) %}
            {% set outdoor = state_attr('weather.forecast_maison', 'temperature') | float(0) %}
            {% if this.state == 'on' %}
              {{ gap >= 3 }}
            {% elif this.state == 'off' %}
              {{ 2 <= rise < 20 and gap >= 3 and outdoor < 18 }}
            {% else %}
              {{ gap >= 4 and outdoor < 18 }}
            {% endif %}
          {% endif %}
