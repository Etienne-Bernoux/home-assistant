input_number:
  annexe_seuil_courant:
    name: Seuil d'alerte de l'annexe
    icon: mdi:current-ac
    unit_of_measurement: A
    min: 10
    max: 20
    step: 0.5
    mode: box
  annexe_puissance_coupure:
    name: Puissance de coupure de l'annexe
    icon: mdi:flash-off
    unit_of_measurement: W
    min: 2000
    max: 5400
    step: 100
    mode: box

counter:
  annexe_coupures:
    name: Coupures successives de l'annexe
    icon: mdi:counter

automation:
  - id: annex_overload_cut
    alias: Couper l'annexe au-delà de sa puissance de coupure
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.annexe_puissance
        above: input_number.annexe_puissance_coupure
        for: "00:00:30"
    conditions:
      - condition: state
        entity_id: switch.annexe_alimentation
        state: "on"
    actions:
      - variables:
          power: "{{ states('sensor.annexe_puissance') | float | round(0) | int }}"
      - action: switch.turn_off
        target:
          entity_id: switch.annexe_alimentation
      - action: counter.increment
        target:
          entity_id: counter.annexe_coupures
      - variables:
          attempt: "{{ states('counter.annexe_coupures') | int }}"
          waits: [1, 1, 3, 5, 10]
      - if:
          - condition: template
            value_template: "{{ attempt <= waits | count }}"
        then:
          - action: notify.etienne
            data:
              title: Annexe coupée
              message: >
                {{ power }} W pendant 30 secondes, au-dessus de la coupure à
                {{ states('input_number.annexe_puissance_coupure') | int }} W. Remise automatique dans
                {{ waits[attempt - 1] }} min (essai {{ attempt }} sur {{ waits | count }}).
          - delay:
              minutes: "{{ waits[attempt - 1] }}"
          - action: switch.turn_on
            target:
              entity_id: switch.annexe_alimentation
        else:
          - action: notify.etienne
            data:
              title: Annexe coupée, remise manuelle
              message: >
                {{ power }} W pendant 30 secondes, au-dessus de la coupure à
                {{ states('input_number.annexe_puissance_coupure') | int }} W, après {{ waits | count }} remises
                automatiques. Réduisez la charge puis rallumez l'annexe depuis le plan de l'étage.

  - id: annex_power_lost
    alias: Alerter si l'annexe est coupée hors coupure automatique
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.annexe_alimentation
        to: "off"
        id: switched_off
      - trigger: numeric_state
        entity_id: sensor.annexe_puissance
        below: 5
        for: "00:02:00"
        id: no_power
    conditions:
      - condition: template
        value_template: >
          {% if trigger.id == 'switched_off' %}
            {{ trigger.to_state.context.parent_id is none }}
          {% else %}
            {{ is_state('switch.annexe_alimentation', 'on') }}
          {% endif %}
    actions:
      - action: notify.etienne
        data:
          title: Annexe coupée
          message: >
            {% if trigger.id == 'switched_off' %}
              L'alimentation de l'annexe a été coupée à la main.
            {% else %}
              L'annexe ne consomme plus rien depuis 2 minutes alors que son alimentation est allumée :
              disjoncteur déclenché ou contacteur ouvert.
            {% endif %}

  - id: annex_overload_cut_reset
    alias: Remettre à zéro les coupures de l'annexe après 30 minutes sans coupure
    mode: restart
    triggers:
      - trigger: state
        entity_id: switch.annexe_alimentation
        to: "on"
        for: "00:30:00"
    actions:
      - action: counter.reset
        target:
          entity_id: counter.annexe_coupures

  - id: annex_line_overload
    alias: Alerter si l'annexe tire près de la limite de sa ligne
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.annexe_courant
        above: input_number.annexe_seuil_courant
        for: "00:15:00"
    actions:
      - action: notify.etienne
        data:
          title: Annexe proche de la limite
          message: >
            L'annexe tire {{ states('sensor.annexe_courant') | float | round(1) }} A
            depuis 15 minutes, au-dessus du seuil de {{ states('input_number.annexe_seuil_courant') | float }} A,
            sur une ligne de 20 A. Évitez d'y lancer en plus le four ou une machine.

template:
  - sensor:
      - name: Prix heures pleines
        unique_id: electricity_peak_price
        icon: mdi:currency-eur
        unit_of_measurement: EUR/kWh
        state: >
          {% from 'mylight.jinja' import ml_tariffs %}
          {{ (ml_tariffs() | from_json | selectattr('from', '<=', now().date() | string) | list | last).peak }}

  - triggers:
      - trigger: state
        entity_id: sensor.annexe_energie
    sensor:
      - name: Coût annexe
        unique_id: annex_cost
        icon: mdi:cash
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        state: >
          {% from 'mylight.jinja' import ml_tariffs %}
          {% set peak = (ml_tariffs() | from_json | selectattr('from', '<=', now().date() | string) | list | last).peak %}
          {% set energy = states('sensor.annexe_energie') %}
          {% set last = this.attributes.get('last_kwh') %}
          {% set total = this.state | float(0) %}
          {% if energy | is_number %}
            {% set delta = energy | float - (last | float(0)) %}
            {% if delta > 0 %}
              {% set total = total + delta * peak %}
            {% endif %}
          {% endif %}
          {{ total | round(4) }}
        attributes:
          last_kwh: >
            {% set energy = states('sensor.annexe_energie') %}
            {{ energy | float if energy | is_number else this.attributes.get('last_kwh') }}

  - triggers:
      - trigger: event
        event_type: annex_meter_reading
    sensor:
      - name: Relevé comparatif annexe
        unique_id: annex_meter_reading
        device_class: timestamp
        state: "{{ trigger.event.time_fired.isoformat() }}"
        attributes:
          meter_kwh: "{{ trigger.event.data.meter_kwh }}"
          shelly_kwh: "{{ trigger.event.data.shelly_kwh }}"
          difference_kwh: "{{ trigger.event.data.difference_kwh }}"
          difference_percent: "{{ trigger.event.data.difference_percent }}"

script:
  record_annex_meter:
    alias: Enregistrer le sous-compteur de l'annexe
    mode: single
    fields:
      index_kwh:
        name: Index du sous-compteur au moment de la saisie
        required: true
        selector:
          number:
            min: 20676.6
            max: 9999999
            step: 0.1
            mode: box
            unit_of_measurement: kWh
    sequence:
      - variables:
          meter: "{{ index_kwh | default(none) | float(none) }}"
          shelly: "{{ states('sensor.annexe_energie') | float(none) }}"
      - if: "{{ meter is none or meter <= 20676.5 or shelly is none or shelly < 69.918 }}"
        then:
          - stop: Index invalide ou compteur Shelly indisponible.
            error: true
      - variables:
          physical_delta: "{{ meter - 20676.5 }}"
          difference: "{{ (shelly - 69.918) - physical_delta }}"
      - event: annex_meter_reading
        event_data:
          meter_kwh: "{{ meter }}"
          shelly_kwh: "{{ shelly }}"
          difference_kwh: "{{ difference | round(3) }}"
          difference_percent: "{{ (100 * difference / physical_delta) | round(2) }}"
