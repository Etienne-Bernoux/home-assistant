title: Annexe
views:
  - title: Annexe
    path: annexe
    icon: mdi:home-floor-a
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Maintenant
            icon: mdi:flash
          - type: tile
            entity: sensor.annexe_puissance
            name: Puissance
          - type: tile
            entity: sensor.annexe_courant
            name: Courant, ligne de 20 A
          - type: tile
            entity: sensor.prix_heures_pleines
            name: Prix appliqué, heures pleines
            grid_options:
              columns: full
          - type: tile
            entity: input_number.annexe_seuil_courant
            name: Alerte au-delà de, pendant 15 min
            grid_options:
              columns: full
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.annexe_puissance_coupure
            name: Coupure au-delà de, pendant 30 s
            grid_options:
              columns: full
            features:
              - type: numeric-input
                style: buttons
          - type: history-graph
            title: Dernières 48 heures
            hours_to_show: 48
            entities:
              - entity: sensor.annexe_puissance
                name: Puissance
      - type: grid
        cards:
          - type: heading
            heading: Consommation et coût
            icon: mdi:cash
          - type: statistic
            entity: sensor.annexe_energie
            name: Aujourd'hui
            stat_type: change
            period:
              calendar:
                period: day
          - type: statistic
            entity: sensor.cout_annexe
            name: Aujourd'hui
            stat_type: change
            period:
              calendar:
                period: day
          - type: statistic
            entity: sensor.annexe_energie
            name: Ce mois-ci
            stat_type: change
            period:
              calendar:
                period: month
          - type: statistic
            entity: sensor.cout_annexe
            name: Ce mois-ci
            stat_type: change
            period:
              calendar:
                period: month
          - type: statistic
            entity: sensor.annexe_energie
            name: Mois dernier
            stat_type: change
            period:
              calendar:
                period: month
                offset: -1
          - type: statistic
            entity: sensor.cout_annexe
            name: Mois dernier
            stat_type: change
            period:
              calendar:
                period: month
                offset: -1
          - type: statistics-graph
            title: Consommation par jour
            entities:
              - entity: sensor.annexe_energie
                name: Annexe
            stat_types:
              - change
            period: day
            chart_type: bar
            days_to_show: 30
          - type: statistics-graph
            title: Coût par mois
            entities:
              - entity: sensor.cout_annexe
                name: Annexe
            stat_types:
              - change
            period: month
            chart_type: bar
            days_to_show: 365
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: >
              **Calcul.** Chaque kWh mesuré par le Shelly EM sur la ligne de l'annexe est compté au
              prix heures pleines en vigueur ce jour-là, même la nuit et même quand le solaire couvre
              la maison, comme si l'annexe avait son propre compteur au tarif le plus cher. Mesure
              du Shelly depuis le 16 novembre 2026 ; avant, les relevés du sous-compteur depuis
              janvier 2024, répartis à parts égales sur les jours de chaque période et comptés au
              prix facturé de la période (du 3 au 16 novembre 2026, estimés au rythme du relevé
              précédent). Une alerte part sur le téléphone si la ligne dépasse le
              seuil réglé ci-dessus pendant 15 minutes (18 A conseillé sur cette ligne de 20 A).
              **Coupure.** Au-delà de la puissance de coupure pendant 30 secondes, le Shelly coupe
              toute l'annexe, puis la rallume seul après 1, 1, 3, 5 et 10 minutes ; à la sixième
              coupure, il faut la rallumer depuis le plan de l'étage. Le compteur repart à zéro après
              30 minutes sans coupure. Sans effet tant que le contacteur est en marche forcée.
