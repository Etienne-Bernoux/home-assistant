title: Rentabilité
views:
  - title: Rentabilité
    path: rentabilite
    icon: mdi:cash-check
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: MyLight face à EDF Tarif Bleu
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.gain_mylight_cumule
            name: Gain cumulé
          - type: tile
            entity: sensor.gain_mylight_annuel_attendu
            name: Gain annuel au tarif en vigueur
          - type: tile
            entity: sensor.remboursement_mylight_estime
            name: Matériel MyLight remboursé le
          - type: statistic
            entity: sensor.gain_mylight_cumule
            name: Gain sur 12 mois
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistics-graph
            title: Gain par mois
            entities:
              - sensor.gain_mylight_cumule
            stat_types:
              - change
            period: month
            chart_type: bar
            days_to_show: 600
      - type: grid
        cards:
          - type: heading
            heading: Amortissement de l'installation
            icon: mdi:solar-power-variant
          - type: tile
            entity: sensor.economie_installation_cumulee
            name: Économie cumulée
          - type: tile
            entity: sensor.amortissement_installation
            name: Part remboursée
          - type: tile
            entity: sensor.economie_annuelle_attendue
            name: Économie annuelle au tarif en vigueur
          - type: tile
            entity: sensor.retour_sur_investissement_estime
            name: Installation remboursée le
          - type: statistics-graph
            title: Économie par mois
            entities:
              - sensor.economie_installation_cumulee
            stat_types:
              - change
            period: month
            chart_type: bar
            days_to_show: 600
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: >
              **Hypothèses.** Gain MyLight : ce que coûterait EDF au Tarif Bleu sans batterie
              (kWh achetés + kWh rendus par la batterie virtuelle, à 0,2142 / 0,1589 €), moins le
              coût MyLight (kWh achetés au prix MyLight, forfait MySmartBattery, contribution
              auto-producteur de 58 €/an, moins la réinjection à 0,042 €/kWh). Économie : même
              coût MyLight comparé à toute la consommation au Tarif Bleu. Abonnement réseau exclu
              des deux côtés. Prix MyLight supposé égal au Tarif Bleu jusqu'au 31 octobre 2026.
              Remboursements : coût du matériel MyLight et de l'installation complète (catalogue `investments`), au gain et à l'économie annuels attendus aux tarifs et forfait en vigueur sur les volumes de l'année de référence. Historique antérieur à la mise en service calculé au pas journalier (75 % heures pleines).
  - title: Solaire
    path: solaire
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 30 derniers jours
            icon: mdi:white-balance-sunny
          - type: statistics-graph
            title: Production (kWh)
            period: day
            days_to_show: 30
            stat_types:
              - change
            chart_type: bar
            entities:
              - entity: sensor.envoy_122333060519_production_d_energie_totale
                name: Production
          - type: statistics-graph
            title: Ensoleillement (kWh/m²)
            period: day
            days_to_show: 30
            stat_types:
              - change
            chart_type: bar
            entities:
              - entity: sensor.ensoleillement
                name: Ensoleillement
      - type: grid
        cards:
          - type: heading
            heading: Par mois
            icon: mdi:calendar-month
          - type: statistics-graph
            title: Production (kWh)
            period: month
            days_to_show: 600
            stat_types:
              - change
            chart_type: bar
            entities:
              - entity: sensor.envoy_122333060519_production_d_energie_totale
                name: Production
          - type: statistics-graph
            title: Ensoleillement (kWh/m²)
            period: month
            days_to_show: 600
            stat_types:
              - change
            chart_type: bar
            entities:
              - entity: sensor.ensoleillement
                name: Ensoleillement
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: >
              **Lecture.** Ensoleillement : rayonnement solaire reçu au sol sur une surface à plat,
              d'après le modèle météo Open-Meteo à la position de la maison, heure par heure.
              Les panneaux étant inclinés, chaque kWh/m² rapporte plus quand le soleil est bas :
              environ 5,5 kWh produits l'été, 9 l'hiver par jour clair, deux fois moins par jour de
              brouillard. Comparer un mois au même mois de l'année précédente : si la production
              baisse alors que l'ensoleillement tient, les panneaux sont sales ou un micro-onduleur
              est en panne.
