title: Rentabilité
views:
  - title: Avec l'annexe
    path: rentabilite
    icon: mdi:cash-check
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: MyLight face à EDF Tarif Bleu
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.gain_mylight_cumule
            name: Gain cumulé
          - type: tile
            entity: sensor.gain_mylight_annuel_attendu
            name: Gain annuel au tarif en vigueur
          - type: tile
            entity: sensor.remboursement_mylight_estime
            name: Matériel MyLight remboursé le
          - type: statistic
            entity: sensor.gain_mylight_cumule
            name: Gain sur 12 mois
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistics-graph
            title: Gain par mois
            entities:
              - sensor.gain_mylight_cumule
            stat_types:
              - change
            period: month
            chart_type: bar
            days_to_show: 600
      - type: grid
        cards:
          - type: heading
            heading: Amortissement de l'installation
            icon: mdi:solar-power-variant
          - type: tile
            entity: sensor.economie_installation_cumulee
            name: Économie cumulée
          - type: tile
            entity: sensor.amortissement_installation
            name: Part remboursée
          - type: tile
            entity: sensor.economie_annuelle_attendue
            name: Économie annuelle au tarif en vigueur
          - type: tile
            entity: sensor.retour_sur_investissement_estime
            name: Installation remboursée le
          - type: statistics-graph
            title: Économie par mois
            entities:
              - sensor.economie_installation_cumulee
            stat_types:
              - change
            period: month
            chart_type: bar
            days_to_show: 600
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: >
              **Hypothèses.** Gain MyLight : ce que coûterait EDF au Tarif Bleu sans batterie
              (kWh achetés + kWh rendus par la batterie virtuelle, à 0,2142 / 0,1589 €), moins le
              coût MyLight (kWh achetés au prix MyLight, forfait MySmartBattery, contribution
              auto-producteur de 58 €/an, moins la réinjection à 0,042 €/kWh). Économie : même
              coût MyLight comparé à toute la consommation au Tarif Bleu. Abonnement réseau exclu
              des deux côtés. Prix MyLight supposé égal au Tarif Bleu jusqu'au 31 octobre 2026.
              Remboursements : coût du matériel MyLight et de l'installation complète (catalogue `investments`), au gain et à l'économie annuels attendus aux tarifs et forfait en vigueur sur les volumes de l'année de référence. Historique antérieur à la mise en service calculé au pas journalier (75 % heures pleines).
  - title: Sans l'annexe
    path: sans-annexe
    icon: mdi:home-account
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: MyLight face à EDF Tarif Bleu, annexe refacturée
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.gain_mylight_cumule_annexe_refacturee
            name: Gain cumulé
          - type: tile
            entity: sensor.gain_mylight_annuel_attendu_annexe_refacturee
            name: Gain par an
          - type: tile
            entity: sensor.remboursement_mylight_estime_annexe_refacturee
            name: Matériel MyLight remboursé le
          - type: statistic
            entity: sensor.gain_mylight_cumule_annexe_refacturee
            name: Gain sur 12 mois
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistics-graph
            title: Gain par mois
            entities:
              - sensor.gain_mylight_cumule_annexe_refacturee
            stat_types:
              - change
            period: month
            chart_type: bar
            days_to_show: 600
      - type: grid
        cards:
          - type: heading
            heading: Amortissement, annexe refacturée
            icon: mdi:solar-power-variant
          - type: tile
            entity: sensor.economie_installation_cumulee_annexe_refacturee
            name: Économie cumulée
          - type: tile
            entity: sensor.amortissement_installation_annexe_refacturee
            name: Part remboursée
          - type: tile
            entity: sensor.economie_annuelle_attendue_annexe_refacturee
            name: Économie par an
          - type: tile
            entity: sensor.retour_sur_investissement_estime_annexe_refacturee
            name: Installation remboursée le
          - type: tile
            entity: sensor.majoration_refacturee_a_l_annexe
            name: Majoration refacturée, cumul
          - type: tile
            entity: sensor.majoration_annuelle_attendue_de_l_annexe
            name: Majoration refacturée par an
          - type: statistics-graph
            title: Économie par mois
            entities:
              - sensor.economie_installation_cumulee_annexe_refacturee
            stat_types:
              - change
            period: month
            chart_type: bar
            days_to_show: 600
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: >
              **Annexe refacturée.** L'annexe est une cliente : elle doit ses kWh au prix heures
              pleines le plus cher de chaque période relevée au sous-compteur (catalogue
              `annex_billing`), puis, depuis le 16 novembre 2026, à celui en vigueur sur les kWh
              mesurés par le Shelly. Sans panneaux ni MyLight, elle paierait le Tarif Bleu heures
              pleines (0,2142 €). La majoration est l'écart entre les deux, sur ses kWh depuis la
              mise en service : elle s'ajoute au gain et à l'économie de la page « Avec l'annexe ».
              Entre le dernier relevé et l'arrivée du Shelly, sa consommation est estimée au rythme
              du dernier relevé ; un nouveau relevé la remplace. Le dû est compté, payé ou non.
              Les kWh annuels attendus de l'annexe sont ceux de l'année de référence, au prorata
              des relevés.
  - title: Solaire
    path: solaire
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 30 derniers jours
            icon: mdi:white-balance-sunny
          - type: custom:apexcharts-card
            section_mode: true
            graph_span: 30d
            span:
              end: day
            yaxis:
              - id: production
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: kWh
              - id: ensoleillement
                opposite: true
                min: 0
                decimals: 1
                apex_config:
                  title:
                    text: kWh/m²
            series:
              - entity: sensor.envoy_122333060519_production_d_energie_totale
                name: Production
                color: "#ff9800"
                yaxis_id: production
                type: column
                statistics:
                  type: change
                  period: day
                  align: start
              - entity: sensor.ensoleillement
                name: Ensoleillement
                color: "#1e88e5"
                extend_to: false
                yaxis_id: ensoleillement
                type: line
                statistics:
                  type: change
                  period: day
                  align: start
      - type: grid
        cards:
          - type: heading
            heading: 12 derniers mois, face à l'année précédente
            icon: mdi:calendar-month
          - type: custom:apexcharts-card
            section_mode: true
            graph_span: 365d
            span:
              end: month
            yaxis:
              - id: production
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: kWh
              - id: ensoleillement
                opposite: true
                min: 0
                decimals: 1
                apex_config:
                  title:
                    text: kWh/m²
            series:
              - entity: sensor.envoy_122333060519_production_d_energie_totale
                name: Production
                color: "#ff9800"
                yaxis_id: production
                type: column
                statistics:
                  type: change
                  period: month
                  align: start
              - entity: sensor.envoy_122333060519_production_d_energie_totale
                name: Production un an avant
                color: "#ffcc80"
                show:
                  offset_in_name: false
                yaxis_id: production
                type: column
                offset: -365d
                statistics:
                  type: change
                  period: month
                  align: start
              - entity: sensor.ensoleillement
                name: Ensoleillement
                color: "#1e88e5"
                extend_to: false
                yaxis_id: ensoleillement
                type: line
                statistics:
                  type: change
                  period: month
                  align: start
              - entity: sensor.ensoleillement
                name: Ensoleillement un an avant
                color: "#90caf9"
                extend_to: false
                show:
                  offset_in_name: false
                yaxis_id: ensoleillement
                type: line
                offset: -365d
                stroke_dash: 4
                statistics:
                  type: change
                  period: month
                  align: start
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Production du jour par micro-onduleur
            icon: mdi:solar-panel
          - type: glance
            columns: 8
            show_icon: false
            entities:
              - entity: sensor.inverter_122404013363_production_d_energie_du_jour
                name: "3363"
              - entity: sensor.inverter_122404013465_production_d_energie_du_jour
                name: "3465"
              - entity: sensor.inverter_122408005778_production_d_energie_du_jour
                name: "5778"
              - entity: sensor.inverter_122408005779_production_d_energie_du_jour
                name: "5779"
              - entity: sensor.inverter_122408005788_production_d_energie_du_jour
                name: "5788"
              - entity: sensor.inverter_122408005790_production_d_energie_du_jour
                name: "5790"
              - entity: sensor.inverter_122408005801_production_d_energie_du_jour
                name: "5801"
              - entity: sensor.inverter_122408005917_production_d_energie_du_jour
                name: "5917"
              - entity: sensor.inverter_122408006012_production_d_energie_du_jour
                name: "6012"
              - entity: sensor.inverter_122408006014_production_d_energie_du_jour
                name: "6014"
              - entity: sensor.inverter_122408006097_production_d_energie_du_jour
                name: "6097"
              - entity: sensor.inverter_122408006715_production_d_energie_du_jour
                name: "6715"
              - entity: sensor.inverter_122408006775_production_d_energie_du_jour
                name: "6775"
              - entity: sensor.inverter_122408007055_production_d_energie_du_jour
                name: "7055"
              - entity: sensor.inverter_122408007063_production_d_energie_du_jour
                name: "7063"
              - entity: sensor.inverter_122408007064_production_d_energie_du_jour
                name: "7064"
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: >
              **Lecture.** Ensoleillement : rayonnement solaire reçu au sol sur une surface à plat,
              d'après le modèle météo Open-Meteo à la position de la maison, heure par heure.
              Les panneaux étant inclinés, chaque kWh/m² rapporte plus quand le soleil est bas :
              environ 5,5 kWh produits l'été, 9 l'hiver par jour clair, deux fois moins par jour de
              brouillard. Comparer un mois au même mois de l'année précédente : si la production
              baisse alors que l'ensoleillement tient, les panneaux sont sales ou un micro-onduleur
              est en panne. Micro-onduleurs : chacun est nommé par la fin de son numéro de série ;
              un écart franc avec les autres en fin de journée signale une panne, et une alerte part
              au coucher du soleil quand l'un a produit moins de la moitié de la médiane.
