title: Musique
views:
  - title: Musique
    path: musique
    icon: mdi:music
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Où
            icon: mdi:speaker-multiple
          - type: tile
            entity: input_select.musique_piece
            name: Pièce
            hide_state: true
            grid_options:
              columns: full
            features:
              - type: select-options
                style: buttons
          - type: heading
            heading: Quoi
            icon: mdi:playlist-music
          - type: button
            name: Découvertes
            icon: mdi:compass-outline
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue de la musique que je pourrais aimer sur Amazon Music
          - type: button
            name: France Inter
            icon: mdi:radio
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue France Inter
          - type: button
            name: Jazz
            icon: mdi:saxophone
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue du jazz sur Amazon Music
          - type: button
            name: Livre Audible
            icon: mdi:book-open-variant
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: lis mon livre audio sur Audible
          - type: button
            name: Calme
            icon: mdi:weather-night
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue de la musique calme sur Amazon Music
          - type: button
            name: Fête
            icon: mdi:party-popper
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue de la musique de fête sur Amazon Music
          - type: entities
            grid_options:
              columns: 8
            entities:
              - entity: input_text.musique_demande
                name: Autre
          - type: button
            name: Lancer
            icon: mdi:play
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
      - type: grid
        cards:
          - type: heading
            heading: En cours
            icon: mdi:music-note
          - type: markdown
            content: Rien ne joue. Choisis une pièce et quoi écouter, puis Lancer.
            visibility:
              - condition: state
                entity: media_player.echo_bureau
                state_not:
                  - playing
                  - paused
              - condition: state
                entity: media_player.echo_dot_salon
                state_not:
                  - playing
                  - paused
              - condition: state
                entity: media_player.echo_dot_cuisine
                state_not:
                  - playing
                  - paused
              - condition: state
                entity: media_player.4eme_echo_dot_etienne
                state_not:
                  - playing
                  - paused
              - condition: state
                entity: media_player.partout
                state_not:
                  - playing
                  - paused
          - type: tile
            entity: media_player.echo_bureau
            visibility:
              - condition: state
                entity: media_player.echo_bureau
                state:
                  - playing
                  - paused
            name: Bureau
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.echo_dot_salon
            visibility:
              - condition: state
                entity: media_player.echo_dot_salon
                state:
                  - playing
                  - paused
            name: Salon
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.echo_dot_cuisine
            visibility:
              - condition: state
                entity: media_player.echo_dot_cuisine
                state:
                  - playing
                  - paused
            name: Cuisine
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.4eme_echo_dot_etienne
            visibility:
              - condition: state
                entity: media_player.4eme_echo_dot_etienne
                state:
                  - playing
                  - paused
            name: Salle de jeu
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.partout
            visibility:
              - condition: state
                entity: media_player.partout
                state:
                  - playing
                  - paused
            name: Partout
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
  - title: Yoto
    path: yoto
    icon: mdi:account-child
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aimée
            icon: mdi:account-child
          - type: tile
            entity: media_player.yoto_aimee
            name: Lecture
            state_content:
              - state
              - media_album_name
              - media_title
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: sensor.yoto_aimee_batterie
            name: Batterie
          - type: tile
            entity: binary_sensor.yoto_aimee_en_charge
            name: Charge
          - type: tile
            entity: sensor.yoto_aimee_mode_jour
            name: Mode
          - type: tile
            entity: binary_sensor.yoto_aimee_casque_audio
            name: Casque
          - type: entities
            title: Réglages
            grid_options:
              columns: full
            entities:
              - entity: time.yoto_aimee_debut_mode_jour
                name: Début du jour
              - entity: time.yoto_aimee_debut_mode_nuit
                name: Début de la nuit
              - entity: number.yoto_aimee_volume_max_mode_jour
                name: Volume max le jour
              - entity: number.yoto_aimee_volume_max_mode_nuit
                name: Volume max la nuit
              - entity: number.yoto_aimee_luminosite_mode_jour
                name: Luminosité le jour
              - entity: number.yoto_aimee_luminosite_mode_nuit
                name: Luminosité la nuit
              - entity: switch.yoto_aimee_volume_max_du_casque
                name: Limiter le volume du casque
      - type: grid
        cards:
          - type: heading
            heading: Ambroise
            icon: mdi:account-child
          - type: tile
            entity: media_player.yoto_ambroise
            name: Lecture
            state_content:
              - state
              - media_album_name
              - media_title
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: sensor.yoto_ambroise_batterie
            name: Batterie
          - type: tile
            entity: binary_sensor.yoto_ambroise_en_charge
            name: Charge
          - type: tile
            entity: sensor.yoto_ambroise_mode_jour
            name: Mode
          - type: tile
            entity: binary_sensor.yoto_ambroise_casque_audio
            name: Casque
          - type: entities
            title: Réglages
            grid_options:
              columns: full
            entities:
              - entity: time.yoto_ambroise_debut_mode_jour
                name: Début du jour
              - entity: time.yoto_ambroise_debut_mode_nuit
                name: Début de la nuit
              - entity: number.yoto_ambroise_volume_max_mode_jour
                name: Volume max le jour
              - entity: number.yoto_ambroise_volume_max_mode_nuit
                name: Volume max la nuit
              - entity: number.yoto_ambroise_luminosite_mode_jour
                name: Luminosité le jour
              - entity: number.yoto_ambroise_luminosite_mode_nuit
                name: Luminosité la nuit
              - entity: switch.yoto_ambroise_volume_max_du_casque
                name: Limiter le volume du casque
