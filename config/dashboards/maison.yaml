  - title: Températures
    path: temperatures
    icon: mdi:thermometer
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dernières 48 heures
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 48
            entities:
              - entity: sensor.temperature_moyenne_maison
                name: Moyenne
              - entity: sensor.echo_dot_salon_temperature
                name: Salon
              - entity: sensor.echo_dot_cuisine_temperature
                name: Cuisine
              - entity: sensor.echo_bureau_temperature
                name: Bureau
              - entity: sensor.salle_de_jeu_temperature
                name: Salle de jeu
      - type: grid
        cards:
          - type: heading
            heading: Moyenne par jour
            icon: mdi:calendar-month
          - type: statistics-graph
            period: day
            days_to_show: 30
            stat_types:
              - mean
            chart_type: line
            entities:
              - entity: sensor.temperature_moyenne_maison
                name: Moyenne
              - entity: sensor.echo_dot_salon_temperature
                name: Salon
              - entity: sensor.echo_dot_cuisine_temperature
                name: Cuisine
              - entity: sensor.echo_bureau_temperature
                name: Bureau
              - entity: sensor.salle_de_jeu_temperature
                name: Salle de jeu
      - type: grid
        cards:
          - type: heading
            heading: Consignes météo
            icon: mdi:weather-partly-rainy
          - type: entities
            entities:
              - entity: input_select.meteo_appareil
              - entity: input_number.meteo_seuil_chaleur
                name: Volets si demain atteint
              - entity: input_number.meteo_seuil_gel
                name: Robinet si la nuit descend à
              - entity: input_number.meteo_seuil_pluie
                name: Pluie à partir de
  - title: Musique
    path: musique
    icon: mdi:music
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Où
            icon: mdi:speaker-multiple
          - type: tile
            entity: input_select.musique_piece
            name: Pièce
            hide_state: true
            grid_options:
              columns: full
            features:
              - type: select-options
                style: buttons
          - type: heading
            heading: Quoi
            icon: mdi:playlist-music
          - type: button
            name: Découvertes
            icon: mdi:compass-outline
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue de la musique que je pourrais aimer sur Amazon Music
          - type: button
            name: France Inter
            icon: mdi:radio
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue France Inter
          - type: button
            name: Jazz
            icon: mdi:saxophone
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue du jazz sur Amazon Music
          - type: button
            name: Livre Audible
            icon: mdi:book-open-variant
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: lis mon livre audio sur Audible
          - type: button
            name: Calme
            icon: mdi:weather-night
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue de la musique calme sur Amazon Music
          - type: button
            name: Fête
            icon: mdi:party-popper
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
              data:
                commande: joue de la musique de fête sur Amazon Music
          - type: entities
            grid_options:
              columns: 8
            entities:
              - entity: input_text.musique_demande
                name: Autre
          - type: button
            name: Lancer
            icon: mdi:play
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.musique_lancer
      - type: grid
        cards:
          - type: heading
            heading: En cours
            icon: mdi:music-note
          - type: tile
            entity: media_player.echo_bureau
            name: Bureau
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.echo_dot_salon
            name: Salon
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.echo_dot_cuisine
            name: Cuisine
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.4eme_echo_dot_etienne
            name: Salle de jeu
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
          - type: tile
            entity: media_player.partout
            name: Partout
            state_content:
              - state
              - media_title
              - media_artist
            grid_options:
              columns: full
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
