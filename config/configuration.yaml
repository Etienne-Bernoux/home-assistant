# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

logger:
  default: warning
  logs:
    aioamazondevices: error

lovelace:
  dashboards:
    dashboard-rentabilite:
      mode: yaml
      title: Rentabilité
      icon: mdi:cash-check
      show_in_sidebar: true
      filename: dashboards/rentabilite.yaml
    dashboard-maison:
      mode: yaml
      title: Maison
      icon: mdi:floor-plan
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/maison.yaml
    dashboard-maison-famille:
      mode: yaml
      title: Maison famille
      icon: mdi:home-heart
      show_in_sidebar: true
      filename: dashboards/maison-famille.yaml
    dashboard-musique:
      mode: yaml
      title: Musique
      icon: mdi:music
      show_in_sidebar: true
      filename: dashboards/musique.yaml
    dashboard-annexe:
      mode: yaml
      title: Annexe
      icon: mdi:home-floor-a
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/annexe.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
