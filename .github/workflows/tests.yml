name: Gherkin tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gherkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm test --prefix tests -- --tags "not @nyons"
